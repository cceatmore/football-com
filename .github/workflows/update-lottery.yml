name: 更新体彩赛程

on:
  schedule:
    # 北京时间 11:00 — 抓取当日开售场次
    - cron: "0 3 * * *"
    # 北京时间 23:00 — 补抓赛果
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 抓取体彩数据
        run: node scripts/fetch-lottery.mjs

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/lottery.json
          if git diff --staged --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore: 自动更新体彩竞彩足球赛程 $(date +%Y-%m-%d)"
            git push
          fi
